{{- /*
Schemas service — serves network.json files over HTTP from a ConfigMap.
Add a new network: drop helmcharts/dpg/files/networks/<name>.json
and append <name> to .Values.schemas.networks. The API picks it up
via NETWORK_CONFIG_URLS (rendered below into the api ConfigMap by
overriding api.config.NETWORK_CONFIG_URLS in values.yaml).

Token substitutions on each JSON before mount:
  __PUBLIC_API_URL__  → browser-facing API URL (per-deploy)
  __SCHEMAS_URL__     → in-cluster URL of this Service
*/}}
{{- if .Values.schemas.enabled }}
{{- $publicApiUrl := .Values.schemas.publicApiUrl | default "" -}}
{{- $schemasUrl := printf "http://%s-schemas" .Release.Name -}}
{{- $name := printf "%s-schemas" .Release.Name -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: schemas
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
{{- range .Values.schemas.networks }}
{{- $file := printf "files/networks/%s.json" . -}}
{{- $raw := $.Files.Get $file -}}
{{- if not $raw }}{{ fail (printf "missing file %s for network %s" $file .) }}{{- end }}
  {{ . }}.json: |
{{ $raw | replace "__PUBLIC_API_URL__" $publicApiUrl | replace "__SCHEMAS_URL__" $schemasUrl | indent 4 }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: schemas
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: schemas
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: schemas
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: nginx
          image: {{ .Values.schemas.image | default "nginx:1.27-alpine" }}
          imagePullPolicy: {{ .Values.schemas.imagePullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
              readOnly: true
          resources:
            {{- toYaml (.Values.schemas.resources | default dict) | nindent 12 }}
      volumes:
        - name: content
          configMap:
            name: {{ $name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: schemas
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app.kubernetes.io/name: schemas
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
