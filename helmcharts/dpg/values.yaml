# =============================================================================
# DPG umbrella chart — centralized values
# Edit ONLY the three sections below (images, resources, credentials).
# Per-subchart blocks at the bottom alias these via YAML anchors.
# =============================================================================

# -----------------------------------------------------------------------------
# Images — single source for all 4 components
# -----------------------------------------------------------------------------
images:
  api: &api_image
    repository: ghcr.io/vinodbhorge/dpg-monorepo/api
    tag: "v1.0.2"
    pullPolicy: IfNotPresent
  ui: &ui_image
    repository: ghcr.io/vinodbhorge/dpg-monorepo/ui
    tag: "v1.0.2"
    pullPolicy: IfNotPresent
  postgresql: &postgresql_image
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: 17.6.0
    pullPolicy: IfNotPresent
  redis: &redis_image
    registry: docker.io
    repository: bitnamilegacy/redis
    tag: 7.2.5
    pullPolicy: IfNotPresent

# Pull secrets shared by api/ui (bitnami charts use image.pullSecrets directly).
imagePullSecrets: &image_pull_secrets []

# -----------------------------------------------------------------------------
# Resources — single source for all 4 components
# -----------------------------------------------------------------------------
resources:
  api: &api_resources {}
    # limits:
    #   cpu: 500m
    #   memory: 512Mi
    # requests:
    #   cpu: 100m
    #   memory: 256Mi
  ui: &ui_resources {}
    # limits:
    #   cpu: 200m
    #   memory: 128Mi
    # requests:
    #   cpu: 50m
    #   memory: 64Mi
  postgresql: &postgresql_resources {}
    # limits:
    #   cpu: 1000m
    #   memory: 1Gi
    # requests:
    #   cpu: 250m
    #   memory: 512Mi
  redis:
    master: &redis_master_resources {}
    replica: &redis_replica_resources {}

# -----------------------------------------------------------------------------
# Credentials — single source for all secret material.
# Passwords below are populated by install.sh (generate_passwords). Helm
# renders them into Secrets via templates/secrets.yaml; subcharts reference
# those Secrets through existingSecret. Do NOT commit real values.
# -----------------------------------------------------------------------------
credentials:
  postgresql:
    existingSecret: &pg_existing_secret dpg-postgres
    adminPasswordKey: &pg_admin_key postgres-password
    userPasswordKey: &pg_user_key password
    username: &pg_username dpg
    database: &pg_database dpg
    password: &pg_password ""  # PG_PW
  redis:
    existingSecret: &redis_existing_secret dpg-redis
    passwordKey: &redis_password_key redis-password
    password: &redis_password ""  # REDIS_PW
  api: &api_secrets
    create: false
    existingSecret: &api_existing_secret dpg-api-secrets
    authSecret: ""  # AUTH_SECRET
    data: {}

# =============================================================================
# Subchart pass-throughs — do NOT edit values here.
# Each block uses anchors from the sections above.
# Non-shared (chart-specific) settings live here.
# =============================================================================

api:
  image: *api_image
  imagePullSecrets: *image_pull_secrets
  resources: *api_resources
  secrets: *api_secrets

  replicaCount: 1
  service:
    type: ClusterIP
    port: 2742
    targetPort: 2742
  ingress:
    enabled: false
  config:
    NODE_ENV: production
    INSTANCE_NAME: dpg
    INSTANCE_ENV: production
    API_DOMAIN: http://api.dpg.local
    API_PORT: "2742"
    AUTH_MIDDLEWARE_ENABLED: "true"
    CREATE_TEST_OTP: "true"
    ALLOWED_ORIGINS: "http://localhost:8080"
    SERVED_DOMAINS: "yellow_dot/student,yellow_dot/tutor,yellow_dot/coaching_center,blue_dot/seeker,blue_dot/provider"
    # Network configs are served by the in-cluster dpg-schemas Service
    # (see the schemas: block below). Add a network: drop the JSON in
    # helmcharts/dpg/files/networks/, append the name to schemas.networks
    # AND append <name>=http://dpg-schemas/<name>.json here.
    NETWORK_CONFIG_SOURCE: remote
    NETWORK_CONFIG_LOCAL_FILE: ""
    NETWORK_CONFIG_URLS: "yellow_dot=http://dpg-schemas/yellow_dot.json,blue_dot=http://dpg-schemas/blue_dot.json"
    ALLOW_EXTRA_SCHEMA_DATA: "false"
    SCHEMA_REGISTRY_URL: ""
  # Hosts assume umbrella release name "dpg". Override --set api.postgres.host=... if different.
  postgres:
    enabled: true
    host: dpg-postgresql
    port: 5432
    # Admin creds (superuser) for the migrate Job — needed for CREATE EXTENSION.
    adminSecret: *pg_existing_secret
    adminUser: postgres
    adminPasswordKey: *pg_admin_key
  redis:
    enabled: true
    host: dpg-redis-master
    port: 6379

ui:
  image: *ui_image
  imagePullSecrets: *image_pull_secrets
  resources: *ui_resources

  # nginx in the UI pod reverse-proxies /api/* to this upstream.
  apiUpstream: "http://dpg-api:2742"

  replicaCount: 1
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  ingress:
    enabled: false
  # UI nginx proxies /api/* to the in-cluster dpg-api service, so the browser
  # only needs to reach the UI pod (single port-forward, API never exposed).
  # VITE_API_URL is intentionally empty so axios baseURL stays empty and
  # the UI sends paths verbatim (/api/...); nginx then proxies to dpg-api.
  runtimeConfig:
    VITE_API_URL: ""
    VITE_API_URLS: ""
    VITE_DEFAULT_API_URL: ""
    VITE_SHOW_INSTANCE_SELECTOR: "false"

postgresql:
  enabled: true
  image: *postgresql_image
  architecture: standalone
  auth:
    username: *pg_username
    database: *pg_database
    password: *pg_password
    postgresPassword: *pg_password
    existingSecret: *pg_existing_secret
    secretKeys:
      adminPasswordKey: *pg_admin_key
      userPasswordKey: *pg_user_key
  primary:
    resources: *postgresql_resources
    persistence:
      enabled: true
      size: 8Gi
    service:
      ports:
        postgresql: 5432
    # Bitnami runs these on an empty data dir (first boot only).
    # Extensions live in the app database; superuser is required.
    initdb:
      scriptsConfigMap: ""
      scripts:
        00-extensions.sql: |
          \connect dpg
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          CREATE EXTENSION IF NOT EXISTS cube;
          CREATE EXTENSION IF NOT EXISTS earthdistance;

redis:
  enabled: true
  image: *redis_image
  architecture: standalone
  auth:
    enabled: true
    password: *redis_password
    existingSecret: *redis_existing_secret
    existingSecretPasswordKey: *redis_password_key
  commonConfiguration: |-
    appendonly yes
    appendfsync everysec
    save ""
    maxmemory 256mb
    maxmemory-policy allkeys-lru
  master:
    resources: *redis_master_resources
    persistence:
      enabled: true
      size: 8Gi
    service:
      ports:
        redis: 6379
  replica:
    replicaCount: 0
    resources: *redis_replica_resources

# Schemas service — nginx pod serving network.json files from a ConfigMap.
# JSON files live in helmcharts/dpg/files/networks/<name>.json.
# Helm substitutes __PUBLIC_API_URL__ and __SCHEMAS_URL__ at render time.
# Add a network: drop <name>.json into files/networks/, append <name> here,
# and append <name>=http://dpg-schemas/<name>.json to api.config.NETWORK_CONFIG_URLS.
schemas:
  enabled: true
  image: nginx:1.27-alpine
  imagePullPolicy: IfNotPresent
  # Browser-facing API URL; used to substitute __PUBLIC_API_URL__ in network.json
  # instance_url fields. For local port-forward keep http://localhost:8080.
  publicApiUrl: "http://localhost:8080"
  networks:
    - yellow_dot
    - blue_dot
  resources: {}
